<!doctype html>
<html lang="es" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vision board · Mi cielo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efe6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi cielo">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="ideas.css">
<script src="../shared/theme-early.js"></script>
</head>
<body class="no-tabbar">
<header class="topbar">
  <a class="home-btn" href="../" data-nav aria-label="Volver al inicio"><span data-icon="casa"></span></a>
  <div class="titles">
    <h1>Vision board</h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
</header>

<main>
  <div class="board-tools">
    <input id="search" type="search" placeholder="Buscar en tu tablero…" autocomplete="off" aria-label="Buscar">
    <button type="button" class="btn small" id="arrange" title="Acomodar las notas">Acomodar</button>
  </div>
  <div class="chips filters" id="filters"></div>
  <p class="board-hint muted small" id="hint">Arrastra las notas a donde quieras. Toca una para girarla, editarla o marcarla.</p>
  <div class="board" id="board"></div>
</main>

<button type="button" class="fab" id="add" aria-label="Nueva nota"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<script src="../shared/icons.js"></script>
<script src="../shared/core.js"></script>
<script src="ideas.js"></script>
</body>
</html>
